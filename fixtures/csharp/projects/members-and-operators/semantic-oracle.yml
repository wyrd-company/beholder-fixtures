authoring:
  notes: 'Facts derived from project source, the project files, the C# language specification and feature specifications, and the .NET SDK documentation, under profile csharp/1 as settled after the C# pilot.
    Rules followed, for review: (1) Contexts: the seven `dotnet build` commands of the `build` task, each `net10.0`, Release, `properties: [Configuration=Release]`, `release: 10.0.403`. (2) Units: one per
    project; `assembly-version` 1.0.0.0, the SDK default for Version 1.0.0; `language-version` is LangVersion when it is a number (9.0, 11.0, 13.0) and 14.0 for `latest`, the version the 10.0.403 compiler
    resolves; `define-constants` is the list the compiler receives after the SDK adds its implicit framework symbols, read with `dotnet msbuild -t:AddImplicitDefineConstants -getProperty:DefineConstants`
    on a copy under /tmp. Every project is a library, so every unit is a distribution; `csharp:reference-alias` records the three ProjectReferences to Catalog.Core with alias `global`; framework references
    are not listed. (3) Each unit''s root is its assembly, `kind: module`, `language-kind: assembly`, path `[<assembly name>]`, with no definition site or anchor; it is the `from` of every site outside
    every namespace and type declaration (the top-level `using` directives and `[assembly:]` attribute), no entity''s parent and no public API member. (4) Definition sites: an identifier; `this` for an
    indexer; the repeated type name for a constructor, static constructor and finalizer; the operator token for an operator (`+`, `==`, `true`, the `+` of `operator checked +`); `implicit` or `explicit`
    for a conversion; the type name, shared with the type, for Coordinate''s primary constructor, whose parameters X and Y are entities. A delegate''s declared parameters are no entities; its synthetic
    `.ctor`, `Invoke`, `BeginInvoke` and `EndInvoke` and their parameters are, anchored on the delegate''s name. (5) Synthetic entities: the default constructor of each class with no declared instance constructor
    (none for static classes or for structs that declare one); RequiredRecord''s default and copy constructors, EqualityContract, Equals(object), Equals(RequiredRecord), GetHashCode, ToString, PrintMembers,
    op_Equality and op_Inequality; Coordinate''s positional properties X and Y, Equals(object), Equals(Coordinate), GetHashCode, ToString, PrintMembers, Deconstruct, op_Equality and op_Inequality. (6) Paths:
    an overloaded member appends its parameters'' metadata type paths separated by `,` with no space, such as `Worker.Transform(System.Int32,System.Int32)` and `PropertySurface.this[](System.String,System.Int32)`;
    a member is overloaded when another entity of its type has the same member name. An explicit interface implementation is `<interface metadata type path with type arguments>.<member>`, such as `Vector2.Catalog.Core.Operators.IAdditive`1<Catalog.Core.Operators.Vector2>.op_Addition`.
    External paths follow the same rule against the overload sets of the net10.0 reference assemblies, where every external here is defined in System.Runtime. (7) Visibility: defaults by the profile; a
    static constructor and an explicit interface implementation are `private`, and the finalizer is `protected`, all with `explicit: false`; InternalsVisibleTo("FriendAccess") makes FriendAccess Catalog.Core''s
    friend unit; a member of a private nested type is scoped to the type that contains the nested type. (8) References: every token that denotes an entity or external; `from` is the innermost entity whose
    declaration contains the site, so a token inside a source parameter''s declaration (its type, default value or attributes) is `from` that parameter, while a delegate''s declared parameters are no entities
    and their tokens are `from` the delegate; a member access targets the member that lookup selects after removing overrides, so `Value.GetHashCode()` targets System.Object.GetHashCode; predefined type
    keywords, `void` included, are `type` references to their System externals (`string` in `string.Empty` is a `qualifier`); `this` and `base` constructor initializers are `call` references to the selected
    constructor; the `[` of an element access that binds to an indexer is a reference by use (`base[index]` read, object-initializer `[2] = 5` write); a user-defined operator token is a `call`; a field-like
    event named inside its class is the event; event `+=` and `-=` are `write`; the interface name in an explicit member name is `type`; the type qualifier of a static member access is `qualifier`. Not
    references: parameters, locals, lambda parameters, pattern variables, discards, `var`, target-typed `new()`, `new T()`, delegate invocation through a local, predefined operators (including delegate
    `+` and `!=`, which a probe showed bind to built-in operators), user-defined conversions and `operator true`/`false`, which have no token. (9) Relations: `inherits` and `implements` at the base-list
    token; a record''s IEquatable<T> implementation has no token; `overrides` for each override and each implicit or explicit interface implementation, to the immediate overridden member (System.ValueType
    for structs, System.Object for classes). (10) Signatures are written from source and the specification, with implied modifiers left out: a struct is not `sealed`, a member of a readonly struct is not
    `readonly`, a delegate''s synthetic members have no modifiers; an interface member with no body is `abstract`; `volatile` is a field modifier. Synthetic slots are `{inferred}`. A record struct''s Equals(object),
    ToString and PrintMembers are nullable-oblivious (`object~`, `string~`, `@{StringBuilder}~`) as the compiler emits them in metadata, which a compile probe outside the tree confirmed; a record class''s
    are annotated. A delegate''s compiler-supplied parameters are oblivious. Signatures were written before any compiler report was run on this project. The Roslyn report''s first run disagreed on Coordinate''s
    Equals(object) and ToString annotations, which settled the profile rule above, and found a report defect in a self-referencing generic constraint. The same author wrote the Roslyn report script, which
    limits independence. No indexer or language service was used.'
