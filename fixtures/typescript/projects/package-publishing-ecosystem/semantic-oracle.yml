project: {"language": "typescript", "name": "package-publishing-ecosystem"}
authoring:
  notes: "Facts derived from project source, package.json and tsconfig files, the TypeScript Handbook and Modules Reference, the TSConfig reference and the Node.js packages documentation. Contexts are the 12 `tsc -p` commands of the `build` task; `options` is the compilerOptions object that `tsc -p <config> --showConfig` prints. Program membership, module resolution and module format come from `tsc --listFilesOnly`, `--traceResolution` and `--explainFiles` run on a copy of the project under /tmp, and type-only elision from a JavaScript emit of that copy (tsconfig.json and tsconfig.bundler.json). The compiler is the project's tracked node_modules/typescript 5.9.3, the profile's corpus version; Node.js is 22.23.4, newer than the profile's 22.6. A probe outside the tree confirmed that `local-ambient` resolves to no module, that `@scope/name` is an ambient module, and that `generic-ambient` and the global augmentation are visible to consumers. No indexer or language service was used."
  tools:
    - name: typescript
      version: "5.9.3"
    - name: Node.js
      version: "22.23.4"
