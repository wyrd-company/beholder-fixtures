# Cargo configuration for async-runtime-and-registration fixture.
# Vendored registry dependencies replace crates-io to enable offline builds.
# tokio 1.47.1 from https://crates.io/crates/tokio/1.47.1 (MIT)
# tracing 0.1.41 from https://crates.io/crates/tracing/0.1.41 (MIT)
# inventory 0.3.21 from https://crates.io/crates/inventory/0.3.21 (MIT OR Apache-2.0 OR Zlib)
# Transitive vendored dependencies: addr2line 0.25.1, adler2 2.0.1, backtrace 0.3.76,
# bitflags 2.13.1, cfg-if 1.0.4, gimli 0.32.3, io-uring 0.7.14, libc 0.2.189, memchr 2.8.3,
# miniz_oxide 0.8.9, mio 1.2.2, object 0.37.3, once_cell 1.21.4, pin-project-lite 0.2.17,
# proc-macro2 1.0.107, quote 1.0.47, rustc-demangle 0.1.28, rustversion 1.0.23,
# slab 0.4.12, syn 2.0.119, tokio-macros 2.5.0, tracing-attributes 0.1.31,
# tracing-core 0.1.36, unicode-ident 1.0.24, wasi 0.11.1+wasi-snapshot-preview1,
# windows-link 0.2.1, windows-sys 0.61.2
# Each crate retains its LICENSE / NOTICE files in vendor/<crate>/ and Cargo.lock
# carries checksums / offline metadata. Source locations above are canonical.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
