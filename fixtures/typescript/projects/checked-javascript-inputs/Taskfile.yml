version: '3'

tasks:
  build:
    desc: Type-check allowJs/checkJs context and emit declarations from JavaScript
    cmds:
      - npx tsc --noEmit -p tsconfig.json
      - npx tsc -p tsconfig.emit.json

  lint:
    desc: tsc no-emit check over fixture sources (vendored source excluded, no tracked source mutated)
    cmds:
      - npx tsc --noEmit -p tsconfig.json

  test:
    desc: No fixture tests; succeeds when no test source is required
    cmds:
      - echo "no tests"
