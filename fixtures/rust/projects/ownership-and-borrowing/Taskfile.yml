# ---
# relationships:
#   references:
#     - coverage
# ---
version: '3'

tasks:
  build:
    desc: Build all fixture-owned crates in every declared build context (offline, non-mutating).
    cmds:
      - cargo build --offline --workspace
      - cargo build --offline --manifest-path crates/edition-2018/Cargo.toml
      - cargo build --offline --manifest-path crates/edition-2021/Cargo.toml

  lint:
    desc: Check formatting and clippy on fixture-owned crates (vendored source excluded).
    cmds:
      - cargo fmt -- --check
      - cargo clippy --offline --workspace --all-targets
      - cargo clippy --offline --manifest-path crates/edition-2018/Cargo.toml --all-targets
      - cargo clippy --offline --manifest-path crates/edition-2021/Cargo.toml --all-targets

  test:
    desc: Compile and run fixture tests (succeeds when no test source is present).
    cmds:
      - cargo test --offline --workspace
