# ---
# relationships:
#   references:
#     - coverage
# ---
version: '3'

vars:
  BUILD_DIR: '{{.TASKFILE_DIR}}/build'
  PUB_CACHE: '{{.TASKFILE_DIR}}/vendor/pub-cache'

tasks:
  build:
    desc: Resolve offline, analyze, and run every declared entry point.
    dir: '{{.TASKFILE_DIR}}'
    env:
      PUB_CACHE: '{{.PUB_CACHE}}'
    cmds:
      - dart pub get --offline
      - dart analyze
      - mkdir -p {{.BUILD_DIR}}
      - dart run bin/analysis_and_docs_main.dart

  lint:
    desc: Check dart format and run dart analyze.
    dir: '{{.TASKFILE_DIR}}'
    env:
      PUB_CACHE: '{{.PUB_CACHE}}'
    cmds:
      - dart format --output=none --set-exit-if-changed .
      - dart analyze

  test:
    desc: Succeed with no planned test files.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ':'
