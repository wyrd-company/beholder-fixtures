[package]
name = "resolver-demo-v2"
version = "0.1.0"
edition = "2024"
description = "Resolver v2 demo"
license = "MIT"
authors = ["Wyrd Company"]
resolver = "2"

# RS-CAN-PROJ-007: same alone/with-sibling shape as resolver-v1, but resolver =
# "2" keeps the dev-only `unify-consumer-b` feature request separate from the
# normal build, so a plain `cargo build` here compiles `unify-shared` with only
# feat-a ("alone"); `cargo test --no-run` (dev-deps included) unifies feat-b in
# too ("with sibling"), same as resolver-v1's default build.
[dependencies]
unify-consumer-a = { path = "../../crates/unify-consumer-a" }

[dev-dependencies]
unify-consumer-b = { path = "../../crates/unify-consumer-b" }

# Also depend on both hyphen versions to show duplicate versions in lockfile
hyphen_v2 = { package = "hyphen-crate", version = "0.2.0", path = "../../crates/hyphen-crate-v02" }

[workspace]
