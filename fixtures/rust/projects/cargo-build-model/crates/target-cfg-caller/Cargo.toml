[package]
name = "target-cfg-caller"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]

[target.'cfg(unix)'.dependencies]
target-unix-dep = { path = "../target-unix-dep" }

[target.'cfg(windows)'.dependencies]
target-windows-dep = { path = "../target-windows-dep" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
target-arch-dep = { path = "../target-arch-dep" }

[target.'cfg(target_os = "linux")'.dependencies]
target-os-dep = { path = "../target-os-dep" }

[target.x86_64-unknown-linux-gnu.dependencies]
target-triple-dep = { path = "../target-triple-dep" }
