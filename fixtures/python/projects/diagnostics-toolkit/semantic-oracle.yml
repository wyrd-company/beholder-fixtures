authoring:
  notes: "Facts derived from project source, pyproject.toml and Taskfile.yml, the Python Language Reference (execution model, import system, data model), the unittest and doctest documentation and source, the typing specification and setuptools package discovery. A helper script transcribed signature slots from source annotations through the author's name table before any compiler report was read. The author then read each record against its declaration in source, with no report open, after the first report's findings were known, and changed no slot. Distribution contents: pyproject.toml has [project] and a setuptools.build_meta [build-system], and no [tool.setuptools] table, so setuptools applies automatic discovery. The flat-layout finder takes the only top-level package, diagnostics_toolkit. Its exclude patterns such as tests and tests.* match top-level names only, so diagnostics_toolkit.tests and diagnostics_toolkit.tests.broken_fixture stay in. No top-level module exists. A wheel built with setuptools 84.2.1 on a copy under /tmp holds all 34 .py files, so every module under diagnostics_toolkit is a unit of the distribution. doctest_text.txt is not in the wheel. Contexts: the import root is the project root, the working directory that python3 -m puts first. The build task's compileall commands, including python3 -OO, only compile files, and the lint task is not a context source, so they define no context. The test task has three commands. python3 -m doctest diagnostics_toolkit/doctest_text.txt runs with search path [.] and realizes the runtime context. python3 -m unittest discover -s diagnostics_toolkit/tests inserts the start directory first on sys.path and keeps it there, so it defines runtime-unittest, in which the test modules and broken_fixture are also importable under top-level names as units with no distribution. python3 -m doctest diagnostics_toolkit/doctest_examples.py inserts diagnostics_toolkit first on sys.path for one import and removes it after that import, so it defines runtime-doctest, in which doctest_examples is the only module that root makes importable. That module imports only __future__. No project command runs a type checker, so typing has command none. Two modules raise when imported, and the facts in them still follow source: diagnostics_toolkit._failing_initializer raises RuntimeError at line 3, and it is private, so it has no public API member and no signature. diagnostics_toolkit.tests.broken_fixture.load_failure_fixture, and its top-level form broken_fixture.load_failure_fixture, raise ModuleNotFoundError at line 3 because nonexistent_broken_module_xyz does not exist. The compiler report cannot import them, so the slots of TestShouldNotBeDiscovered and its test_dummy stay unchecked. External key paths follow import bindings in the CPython 3.14 standard library source to the defining module. The installed CPython (3.14.10) differs from the profile corpus toolchain (3.14.6). A helper script under /tmp parsed source with CPython ast, applied the author's resolution rules and a table of author-decided external names, and formatted the YAML."
  tools:
    - name: CPython
      version: "3.14.10"
    - name: setuptools
      version: "84.2.1"
    - name: Python Language Reference
      version: "3.14"
    - name: Python typing specification
      version: "2026-06"
