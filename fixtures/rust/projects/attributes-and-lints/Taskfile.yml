# ---
# relationships:
#   references:
#     - coverage
# ---
version: '3'

tasks:
  build:
    desc: Build all fixture-owned crates in every declared build context (offline, non-mutating).
    cmds:
      - cargo build --offline
      - cargo build --offline --manifest-path crates/lint_workspace_member/Cargo.toml
      - cargo build --offline --manifest-path crates/lint_downstream/Cargo.toml
      - cargo build --offline --manifest-path crates/cfg_attr_no_std/Cargo.toml
      - RUSTFLAGS="--cfg fixture_no_std_edge" cargo build --offline --manifest-path crates/cfg_attr_no_std/Cargo.toml

  lint:
    desc: Check formatting and clippy on fixture-owned crates (vendored source excluded).
    cmds:
      - cargo fmt -- --check
      - cargo clippy --offline --workspace --all-targets
      - cargo fixture-lint-deny
      - cargo fixture-lint-cap

  test:
    desc: Compile and run fixture tests (succeeds when no test source is present).
    cmds:
      - cargo test --offline --workspace
