[package]
name = "hyphen-crate"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
description.workspace = true
license.workspace = true
authors.workspace = true

# No [lib] override: the library target takes Cargo's default hyphen-to-underscore
# mapping of the package name (`hyphen-crate` -> `hyphen_crate`). Contrast with
# `hyphen-crate-v03`, which explicitly overrides `[lib] name = "hyphen_crate_lib"`.

[[bin]]
name = "hyphen-executable"
path = "src/bin/hyphen_bin.rs"

[lints]
workspace = true
