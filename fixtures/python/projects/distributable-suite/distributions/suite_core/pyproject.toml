[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "distributable-suite-core"
dynamic = ["version"]
description = "Core fixture for distributable-suite — flat layout, dynamic version, markers, extras, resources"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Wyrd Company"}]
keywords = ["fixture", "packaging"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "requests>=2.28.1",
  "importlib-metadata; python_version < '3.11'",
  "typing-extensions; python_version >= '3.10' and platform_system == 'Linux'",
  "pywin32; sys_platform == 'win32'",
  "packaging; implementation_name == 'cpython'",
  "certifi @ file:///tmp/local-certifi-placeholder.whl ; sys_platform == \"win32\"",


  "urllib3; (python_version >= '3.10' and sys_platform == 'linux') or implementation_name == 'cpython'",
  "idna>=3.0,!=3.2,~=3.4",
  "charset-normalizer>=2.0,<4.0",
  "legacy-pkg==1!2.0.0",
  "legacy-pkg-pre==2.0a1",
  "legacy-pkg-post==2.0.post1",
  "legacy-pkg-dev==2.0.dev0",
  "legacy-pkg-local==2.0+local.1",
  "legacy-pkg-arb===2.0.0",
]
optional-dependencies.visualization = [
  "matplotlib>=3.5",
  "requests>=2.28.1",
]
optional-dependencies.office = [
  "openpyxl>=3.0",
  "requests>=2.28.1",
]
optional-dependencies.full = [
  "distributable-suite-core[visualization]",
  "distributable-suite-core[office]",
]

[project.urls]
Homepage = "https://example.invalid/distributable-suite-core"
Repository = "https://example.invalid/repo"

[project.entry-points."suite.plugins"]
alpha = "suite_core.plugins:plugin_alpha"
beta = "suite_core.plugins:plugin_beta"

[project.scripts]
suite-tool = "suite_core.cli:main"

[tool.setuptools]
package-dir = {"" = "."}
py-modules = ["suite_standalone"]

[tool.setuptools.data-files]
"share/suite_core" = ["suite_core/resources/data.txt"]

[tool.setuptools.package-data]
suite_core = ["resources/*.txt", "resources/*.dat", "_generated_version.py"]
suite_shared_ns = ["*.txt"]

[tool.setuptools.exclude-package-data]
"*" = ["*.secret"]

[tool.setuptools.dynamic]
version = {attr = "suite_core._generated_version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["suite_core*", "suite_shared_ns*"]
exclude = ["tests*"]
namespaces = true

# Build-only file demonstration: see PKG-004.

