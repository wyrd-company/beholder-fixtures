# ---
# relationships:
#   references:
#     - coverage
# ---
version: '3'

vars:
  BUILD_DIR: '{{.TASKFILE_DIR}}/build'

tasks:
  build:
    desc: Resolve offline, analyze, and compile every declared entry point.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - dart pub get --offline
      - dart analyze
      - mkdir -p {{.BUILD_DIR}}
      - dart run bin/vm_main.dart
      - >-
        dart compile js
        -o {{.BUILD_DIR}}/js_main.js
        bin/js_main.dart

  lint:
    desc: Check dart format and run dart analyze.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - dart format --output=none --set-exit-if-changed .
      - dart analyze

  test:
    desc: Succeed with no planned test files.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ':'
