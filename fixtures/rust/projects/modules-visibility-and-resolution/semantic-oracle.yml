model: semantic-oracle/1
profile: rust/1
project:
  language: rust
  name: modules-visibility-and-resolution
authoring:
  notes: |-
    Facts derived from project source, the Cargo manifests and Taskfile.yml, the Rust Reference, the Cargo Book, and the rust-src of the installed toolchain. Probes ran in a copy under /tmp (cargo -v and the unstable --unit-graph output via RUSTC_BOOTSTRAP=1). The installed toolchain is rustc/cargo 1.99.1, which rust-toolchain.toml selects and every context names as its release.

    Contexts. The build and test tasks hold eleven commands; each defines one context and no two have the same parameter values:
    - build: cargo build --workspace (all eight workspace libs, mvr-bin, and skew_v2 as a path dependency).
    - build-cfg-a: RUSTFLAGS --cfg fixture_use_a, no -p, so packages is the root package only; cfg differs from every other command.
    - build-skew-v2, build-edition2015, build-edition2018: --manifest-path of a package manifest; manifest and packages differ.
    - build-target: explicit --target x86_64-unknown-linux-gnu equals the host triple, so target matches the commands without --target. It does not merge: packages is the root package (no --workspace) and cfg is empty, which no other command has.
    - doc, doc-private, doc-skew-v2: cargo doc; packages or manifest differ. RUSTDOCFLAGS hold no --cfg (lint flags and --document-private-items are not context parameters).
    - test, test-skew-v2: cargo test; profile `test` (unit graph), mode test.
    - doctest, doctest-skew-v2: the doctest collection each cargo test command performs for the lib targets it tests (mode doctest, selection [lib], profile test). Only lib units are collected; mvr-bin is not a unit of doctest.
    cargo doc also check-compiles dependencies (rustc --emit=metadata, mode build) and cargo test also compiles each lib normally for doctests (mode build). These dependency compilations define no context of their own; their units are members of the doc or test context, as the profile unifies integration tests with lib units. A unit compiled only as a dependency carries the unit attribute mode build in those contexts: skew-v2-lib in doc, doc-private, test and doctest; direct-lib, transitive-lib, skew-v1-lib and edition2015-lib in doc-private. Because the context-variant form must partition the unit's contexts, the other contexts of those units list their own context mode (R-Q25).
    Commands without --target use the corpus toolchain host x86_64-unknown-linux-gnu, as the profile states.

    Units. Every workspace member lib, the excluded path dependency crates/skew_v2, and mvr-bin are units. fixture-skew 0.1.0 and 0.2.0 are two units and two distributions; their unit keys differ by package-version. skew-v2-lib is one unit in build, build-cfg-a, build-target, doc, doc-private and test (selected as a dependency of the root manifest) and in build-skew-v2, doc-skew-v2 and test-skew-v2 (selected by its own manifest), because its unit key is the same. No external targets fixture-skew, so the external-key version rule does not apply; both versions are project units.

    cfg and #[path]. mod cfg_selected is one module with two definition sites, each with its contexts (D1). Items in cfg_selected_a.rs and cfg_selected_b.rs are separate records with disjoint contexts. shared_source.rs is mounted three times in the lib (two #[path] mods and include!) and once in the bin: four entity sets.

    Profile rules applied that the calibration decided: keyword path segments crate, self, super and Self are references; primitive types are not entities and their inherent items are core externals such as f64::EPSILON and str::len; a reference inside a parameter's type has the parameter as from; outer attributes and pub(in ...) paths take the enclosing entity as from, and the pub(in ...) path has role qualifier; built-in and tool attributes name no entity; include! of an indexed file gives origin source and no macro-expansion fact; items re-exported from another project crate are public API members of the re-exporting distribution, with the re-exporting unit's contexts; tuple fields are named by index, have no definition site, and pub tuple fields of members are members; the glob re-export of the pub(crate) macro binding shared_macro has visibility pub(crate); a macro_rules re-exported by pub(crate) use has unit access all; #[macro_export] macros have the crate root as parent; rust:reachable-unnameable via lists every exposing entity, sorted. #[derive(Debug, Clone)] on namespaces::DemoDerive generates two trait-impl blocks with fmt and clone (expansion checked with rustc -Zunpretty=expanded on a /tmp copy), recorded as origin generated with anchor on the derive name, implements and overrides relations, and a rust:macro-expansion fact per block and item; their parameters are generated parameter entities (R-Q26). Unit access is the widest over in-crate paths, narrowed by each module and re-export on the path; a scope that holds the unit root is written all.

    Signatures. Slots were written from source and the Rust Reference, then compared with rustdoc JSON and an auto-trait compile check for each of the thirteen contexts. Each public type's fields are u32, &'static str, Vec<u32> or Option<u32>, so each holds all five auto traits with no condition. No callable returns an opaque type. mvr.namespaces.DemoDerive has one bases entry per derived implementation, and mvr.scopes_shadowing.BodyLocalType one for its implementation inside a function body; neither has a type reference from its source declaration.
  tools:
    - {name: "rustc", version: "1.99.1"}
    - {name: "cargo", version: "1.99.1"}
    - {name: "rustdoc JSON", version: "rustc 1.99.1, format 61"}
    - {name: "Rust standard library source (rust-src)", version: "1.99.1"}
    - {name: "The Rust Reference", version: "1.99"}
    - {name: "The Cargo Book", version: "1.99"}

