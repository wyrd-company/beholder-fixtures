      - task --dir projects/generics-and-inference lint
      - task --dir projects/type-level-programming lint
      - task --dir projects/runtime-constructs-and-emit lint
      - task --dir projects/alternate-tools-and-hosts lint

  test:
    desc: Test all TypeScript fixture projects
    cmds:
      - task --dir projects/program-solution-workspace test
      - task --dir projects/compiler-options-matrix test
