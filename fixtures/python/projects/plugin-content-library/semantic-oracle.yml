model: semantic-oracle/1
profile: python/1
project:
  language: python
  name: plugin-content-library
authoring:
  notes: 'Facts derived from project source, pyproject.toml and Taskfile.yml, the Python Language Reference (execution
    model, import system), the importlib, site and .pth documentation, PEP 420, PEP 562, the typing specification
    (stubs, library interface rules) and setuptools package discovery. Probes ran on a copy of the project under
    /tmp with CPython 3.14.10 (python3.14 -B): every module and namespace package below the project root imports
    from the root; content_library.legacy_pkg.extra_plugin imports through the package''s extended __path__; from
    content_library.ambiguous_pkg import handler binds the package attribute; the committed .pyc carries the 3.14
    magic number. setuptools 84.2.1 default flat-layout discovery (no [build-system] or [tool.setuptools] table)
    stops with ''Multiple top-level packages discovered'', so the distribution builds no import package and has
    no units. Contexts: the build task''s commands (compileall, two python3 -c helpers, gcc) import no project module
    and run with the same interpreter, platform, options and search path as the runtime context, so they define
    no further context; compileall only byte-compiles files. The test task runs no Python. Neither .pth file lies
    in a site directory that configuration or a task declares, so neither adds a root. External key paths follow
    import bindings in the CPython 3.14 standard library source to the defining module. The installed CPython (3.14.10)
    differs from the profile corpus toolchain (3.14.6). A helper script under /tmp parsed source with CPython ast
    and tokenize, applied the author''s resolution rules and formatted the YAML.'
  tools:
  - {name: CPython, version: 3.14.10}
  - {name: setuptools, version: 84.2.1}
  - {name: Python Language Reference, version: '3.14'}
  - {name: Python typing specification, version: 2026-06}
