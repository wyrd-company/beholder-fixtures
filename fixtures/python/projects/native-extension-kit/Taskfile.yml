version: '3'

tasks:
  build:
    desc: Byte-compile fixture-owned packages and compile native/limited/ctypes and zip artifacts.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -m compileall -q native_extension_kit zip_src generator_input
      - sh -c 'set -e; suffix=$(python3 -c "import sysconfig; print(sysconfig.get_config_var(\"EXT_SUFFIX\"))"); inc=$(python3-config --includes 2>/dev/null || python3 -c "import sysconfig; print(\"-I\"+sysconfig.get_config_var(\"INCLUDEPY\"))"); echo "building single-phase extension"; gcc -shared -fPIC native_extension_kit/_native_single.c $inc -o "native_extension_kit/_native_single${suffix}"; echo "built _native_single${suffix}"; echo "building multi-phase extension"; gcc -shared -fPIC native_extension_kit/_native_multi.c $inc -o "native_extension_kit/_native_multi${suffix}"; echo "built _native_multi${suffix}"; echo "building limited-API extension"; gcc -DPy_LIMITED_API=0x030A0000 -shared -fPIC native_extension_kit/_native_limited.c $inc -o "native_extension_kit/_native_limited.abi3.so"; echo "built _native_limited.abi3.so"; echo "building wrong-init extension"; gcc -shared -fPIC native_extension_kit/_native_wrong.c $inc -o "native_extension_kit/_native_wrong${suffix}"; echo "built _native_wrong${suffix}"; echo "building ctypes library"; gcc -shared -fPIC native_extension_kit/libnative_kit.c -o "native_extension_kit/libnative_kit.so"; echo "built libnative_kit.so"'
      - python3 build_zipapp.py

  lint:
    desc: Parse and byte-compile every fixture-owned source file.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 -m py_compile generate.py build_zipapp.py
      - >-
        find native_extension_kit zip_src generator_input -type f \( -name '*.py' -o -name '*.pyi' \) -print0 |
        xargs -0 python3 -m py_compile

  test:
    desc: Succeed with no planned test files.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - ':'

  generate:
    desc: Generate committed .py and .pyi from retained input.
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - python3 generate.py
