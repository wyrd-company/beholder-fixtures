# Analyzer configuration demonstrating include chaining, lints, severity
# changes, exclusions, strict options, and generated-file handling.
include: analysis_options_base.yaml

analyzer:
  exclude:
    - lib/generated/**
    - lib/analyzer_config/excluded_still_compiles.dart
    - vendor/**
    - build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_assignment: error
    missing_required_param: error
    todo: ignore

linter:
  rules:
    - avoid_print
    - avoid_empty_else
    - prefer_const_constructors
    - avoid_returning_null_for_void
    - avoid_types_as_parameter_names
    - cancel_subscriptions
    - close_sinks
    - non_constant_identifier_names
