# DART-CAN-BUILD-005: a maintained, config/input-file-driven generator.
# ffigen's provenance is this configuration file plus the C header it names
# below, not a Dart annotation. `task generate` invokes it once; its output
# (lib/src/native/libc_bindings.g.dart) is committed, and build/lint/test
# never re-run it.
name: LibcSubsetBindings
description: >-
  FFI bindings generated from lib/src/native/libc_subset.h, a small, stable
  libc subset used to demonstrate configuration-driven binding generation.
output: 'lib/src/native/libc_bindings.g.dart'
llvm-path:
  - '/home/linuxbrew/.linuxbrew'
headers:
  entry-points:
    - 'lib/src/native/libc_subset.h'
compiler-opts:
  - '-I/home/linuxbrew/.linuxbrew/Cellar/llvm/22.1.8/lib/clang/22/include'
functions:
  include:
    - 'strnlen'
    - 'round'
preamble: |
  // GENERATED CODE - DO NOT MODIFY BY HAND
  //
  // Generated by ffigen (config: ffigen.yaml) from lib/src/native/libc_subset.h.
  // ignore_for_file: type=lint
