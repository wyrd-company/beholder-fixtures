[project]
name = "layered-settings-resolver"
version = "0.1.0"
description = "Layered settings resolver exercising Python binding and scope semantics"
requires-python = ">=3.10"
readme = "coverage.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["layered_settings_resolver*"]
