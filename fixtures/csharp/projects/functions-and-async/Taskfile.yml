version: '3'

tasks:
  build:
    desc: Compile every declared build context without restoring from the network.
    cmds:
      - dotnet build src/FunctionsAndAsync/FunctionsAndAsync.csproj --no-restore -c Release
      - dotnet build contexts/csharp9/CSharp9.csproj --no-restore -c Release
      - dotnet build contexts/csharp12/CSharp12.csproj --no-restore -c Release
      - dotnet build contexts/csharp13/CSharp13.csproj --no-restore -c Release
      - dotnet build contexts/entrypoint-task/EntryPointTask.csproj --no-restore -c Release
      - dotnet build contexts/entrypoint-taskofint/EntryPointTaskOfInt.csproj --no-restore -c Release
  lint:
    desc: Verify formatting and analyzer warnings for fixture-owned source.
    cmds:
      - dotnet format FunctionsAndAsync.sln --verify-no-changes --no-restore
      - dotnet build src/FunctionsAndAsync/FunctionsAndAsync.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp9/CSharp9.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp12/CSharp12.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp13/CSharp13.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/entrypoint-task/EntryPointTask.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/entrypoint-taskofint/EntryPointTaskOfInt.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
  test:
    desc: Succeed when a project has no test source.
    cmds:
      - echo "No test source"
