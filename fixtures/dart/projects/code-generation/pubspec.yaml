name: toolshed_catalog
description: >-
  A code-generation package exercising part-based and standalone-library
  generation, builder configuration and asset graphs, generated-source
  formatting conventions, and a config-driven generator. The package name
  (toolshed_catalog) is independent of the exclusive fixture directory name
  (code-generation).
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.2 <4.0.0'

platforms:
  linux:
  macos:
  windows:

dependencies:
  ffi: ^2.2.0

dev_dependencies:
  build: ^4.0.10
  build_config: ^1.3.2
  build_runner: ^2.16.0
  dart_style: ^3.1.2
  ffigen: ^20.1.1
  source_gen: ^4.2.4
