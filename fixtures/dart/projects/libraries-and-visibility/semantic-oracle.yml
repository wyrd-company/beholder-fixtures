model: "semantic-oracle/1"
profile: "dart/1"
project: {"language": "dart", "name": "libraries-and-visibility"}
authoring:
  notes: |-
    Facts derived from project source, pubspec.yaml and Taskfile.yml, and the Dart Programming Language Specification and language documentation (libraries, imports and exports, configurable imports, deferred loading, extensions, wildcards). The installed SDK is Dart 3.13.7, so every context has release '3.13'; the package's SDK constraint is '>=3.12.2 <4.0.0', so units have language version 3.12, except lib/wildcards/legacy_wildcards.dart, whose `// @dart=2.19` comment gives 2.19.

    Pilot. This is the Dart signature pilot of wyrd-company/beholder#73. It was chosen because it has a real public API of 50 public libraries, with export chains, a re-export diamond, an export cycle, a conditional export and a `lib/src` facade. It also declares three named public extensions, `VisibleGreeter`, `HiddenGreeter` and `DescribableExtension`, which exercise the extension `receiver` slot.

    Contexts. The build task runs `dart pub get --offline` (no context), `dart analyze` (context `analysis`: entry analysis, platform vm), `dart run bin/vm_main.dart` (context `vm`) and `dart compile js -o build/js_main.js bin/js_main.dart` (context `js`); the test task runs `:`. `library-flags` lists every `dart.library.*` value true for the command, from the SDK's lib/libraries.json: the public libraries of the `vm` target for `dart run`, and of the `dart2js` target for `dart compile js`, less those marked `support_conditional_import: false` (`io` and `isolate` for dart2js). Private `_` libraries are left out, because no source can import them. `dart analyze` declares no environment, so the analyzer treats no flag as true and selects each configurable directive's default URI, and `analysis` has no library flags. The first matching condition in source order selects the same branch as before: `dart.library.io` in vm and `dart.library.js_interop` in js. Indexed documents are every `.dart` file under lib/ in `analysis`, and the files each entry reaches through the selected URIs of its imports and exports in vm and js: platform_api, platform_selector and deferred_payload in both; first_match_selector and platform_native in vm; platform_web in js. The bin files are indexed only in their own context, because the profile indexes only lib/ in `analysis`.

    References. Every URI of a configurable directive is a reference to the library it names, `import` for an import and `export` for an export,, selected or not, in each context where that library is built; a library no URI selects in a context is not built there, so it has no unit in that context and no reference can target it. A part URI and a URI-form `part of` are `import` references to the owning library; a legacy `part of <name>` names no entity and is no reference. Each type name in a type position is a `type` reference, including the `dart:core` classes that signatures write bare (String, int, double, num); `void` is a keyword. A reference inside a parameter's type has the parameter as `from`. An annotation `@C(...)` targets the constructor it invokes. SDK operators (`*`, `+`, `++` on core types) are not user-defined and have no reference; a local variable, local function and parameter is never a target. A `.runtimeType` on a `JSObject` resolves to `Object.runtimeType`.

    Exports. An export relation's `at` is the combinator name when the directive has `show`, and otherwise the URI string of the first directive in source order that adds the name, as for a glob re-export: cycle_a gets ExtraGadget first through `cycle_b.dart`.

    Synthetic entities. Each class without a constructor has its default constructor, anchored on the class name; each deferred prefix has its `loadLibrary` function, anchored on the prefix.

    Signatures. Slots were written from source and the Dart specification before any compiler report was read, then checked with scripts/semantic-oracle/report-dart.dart (package:analyzer 14.7.0 on Dart 3.13.7) in all three contexts: 110 slots, 109 agreed, 0 errors, 1 unchecked. The 16 slots of the six unnamed constructor records agreed at the first check. The unchecked slot is `bases` of ForeignSubclass: a base's slot path holds the dataset's ids, which a report cannot name. The first check had two errors, the analyzer report stating `parameters[0].name` and `parameters[1].name` as `_` for wildcardParameters. The cause was a report gap: from language version 3.7 a `_` parameter is a wildcard that binds no name, so the record correctly has none, and the report now omits it.

    Profile rules this key applies (wyrd-company/beholder#77):
    - A wildcard parameter, `_` at language version 3.7 or later, binds no name and declares no entity; its signature entry has a `type` and no `name`. wildcardParameters(int _, String _) has no parameter entities and two unnamed parameter entries.
    - The unnamed constructor of an exported class is a public API member with the consumer path segment `new`, and so is a class's synthetic default constructor. Six unnamed constructors have records: their `this.` parameters have an `{inferred}` type, and each is `const`. The eight synthetic default constructors have no parameter and no modifier, so they have no slot and no record.
    - A deferred prefix's synthetic `loadLibrary` keeps the importing library as its `parent` and is no public API member, because a consumer cannot name another library's import prefix.
  tools:
    - {"name": "Dart SDK", "version": "3.13.7"}
    - {"name": "package:analyzer", "version": "14.7.0"}
    - {"name": "Dart Programming Language Specification", "version": "3.13"}
