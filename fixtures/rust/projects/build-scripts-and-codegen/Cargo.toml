[package]
name = "build-scripts-and-codegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fixture for build-script protocol and code generation"
license = "MIT"
authors = ["Wyrd Company"]

[workspace]
members = ["crates/fixture-native-sys"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fixture_build_cfg)", "cfg(native_available)", "cfg(host_target_match)", "cfg(fixture_conditional)"] }

[workspace.lints.clippy]
all = "warn"

[lib]
name = "build_scripts_and_codegen"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
fixture-native-sys = { path = "crates/fixture-native-sys" }

[lints]
workspace = true
