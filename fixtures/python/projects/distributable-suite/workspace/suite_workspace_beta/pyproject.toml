[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "suite-workspace-beta"
version = "0.2.0"
description = "Workspace member beta depending on alpha via path for PKG-020"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "suite-workspace-alpha>=0.2.0",
  "requests>=2.0",
]

[tool.setuptools]
packages = ["suite_workspace_beta"]
