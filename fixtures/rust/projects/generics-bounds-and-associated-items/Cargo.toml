[package]
name = "generics-bounds-and-associated-items"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fixture for generics, bounds, and associated items"
license = "MIT"
authors = ["Wyrd Company"]

[workspace]
members = ["crates/capture-2021"]
resolver = "3"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fixture_cfg)"] }
dead_code = "warn"

[workspace.lints.clippy]
all = "warn"

[lib]
name = "generics_bounds_and_associated_items"
path = "src/lib.rs"
crate-type = ["rlib"]

[lints]
workspace = true
