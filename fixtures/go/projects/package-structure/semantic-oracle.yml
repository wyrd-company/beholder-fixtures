project: {language: "go", name: "package-structure"}
authoring:
  notes: |-
    Facts derived from project source, go.mod and Taskfile.yml, the Go Programming Language Specification, `go help packages`, `go help test` and the Go Modules Reference. Toolchain: go1.27.3 (gc, linux/amd64). It supports the module's `go 1.26` directive; no rule used here differs between go1.26 and go1.27.

    Contexts. The `build` task runs `go build ./...` and the `test` task `go test ./...`; each defines one context (mode build and mode test). `go vet` runs only in the `lint` task, so it defines no context. No command assigns GOOS, GOARCH, GOAMD64, CGO_ENABLED or tags, so both take the host values the Go fixture plan declares: linux, amd64, v1, cgo enabled, gc, no tags.

    Units. Nine library packages, the external test package `pantry_test` (mode test only) and the command `cmd/showcase`. Three package names differ from their directory (`quantity` in `measure`, `pattern` in `patterns`, `label` in both `labels/bright` and `labels/dim`); entity paths use import paths, so the two `label` packages are distinct units with equal declarations. A package entity's definition sites are the package clause of each of its files. No package has in-package `_test.go` files, so each package unit has the same files in both contexts.

    Visibility. `internal/notes` is under the module root's `internal` directory, so its exported names are project-scoped to every unit of the module, and `external` is `none` because the `internal` parent lies inside the distribution. Exportedness follows the first rune's Unicode class: `Étage` (Lu) is exported and `πράγμα` (Ll) is not. Entity ids are ASCII (`pantry.Etage`, `pantry.pragma`); their names and paths keep the source spelling.

    Entities and references. The blank identifier declares no entity: the `_` struct field of `Parcel`, the `_` results of `blankReturns`, `var _ shelfOpener = Shelf{}` and the blank imports. A type token in an unnamed or blank result, or in the blank field, has the enclosing declaration (callable or struct) as `from`; a token in a named parameter, result or receiver has that parameter. A site in a package-level blank declaration has the unit root as `from`. `type localPoint PackagePoint` inside `localNamedTypes` is body-local and out-of-profile; its fields are the fields of PackagePoint's struct type, so the keys and selectors `X` and `Y` on `localPoint` values target `PackagePoint.X` and `PackagePoint.Y`. Locally shadowed predeclared names in `shadowedUniverse` (`any`, `comparable`, `clear`, `min`, `max`, `len`, `true`, `nil`) denote body-local declarations and are out-of-profile; `delete` and the predeclared types there are references. Predeclared identifiers are externals of distribution `go` with path `builtin.<name>`, as the profile's References section and its example state. `//line` and `/*line*/` directives change only logical positions; locators are physical.

    Relations. `shelfOpener` is the only interface the project declares. By the method-set rule only `Shelf` implements it (value receiver `Open() string`), so there is one `implements` pair, without `go:pointer-receiver`, and one `overrides`. `Earlier` and `PackagePointAlias` alias defined types. No struct embeds a field, and there is no `//go:linkname` or `//go:embed`, so all four extensions are empty.

    Signatures. Slots were written from source and the Go specification before any report was read: constants by the Constants section (untyped kind, exact value; `6.022e23` is integral, `1_000.25` is 4001/4, `0755` and `0o755` are 493), `var X = "..."` as {inferred: string}. They were then compared with the go/types report for both contexts. `Shelf`'s `bases` entry is not stated by the report; a go/types `types.Implements` probe run outside the project tree, over every project type and interface, found the same single pair.
  tools:
    - {name: "go", version: "go1.27.3"}
    - {name: "The Go Programming Language Specification", version: "go1.27"}
    - {name: "Go Modules Reference", version: "go1.27"}
