version: '3'

tasks:
  build:
    desc: Compile every declared build context without restoring from the network.
    cmds:
      - dotnet restore TypesAndValues.sln --ignore-failed-sources --disable-parallel
      - dotnet build src/Core/Core.csproj --no-restore -c Release
      - dotnet build src/Nullable/AnnotatedApi/AnnotatedApi.csproj --no-restore -c Release
      - dotnet build src/Nullable/ObliviousLegacy/ObliviousLegacy.csproj --no-restore -c Release
      - dotnet build src/Nullable/AnnotationsOnly/AnnotationsOnly.csproj --no-restore -c Release
      - dotnet build src/Nullable/WarningsOnly/WarningsOnly.csproj --no-restore -c Release
      - dotnet build src/Nullable/DisabledScope/DisabledScope.csproj --no-restore -c Release
      - dotnet build src/Nullable/Consumer/Consumer.csproj --no-restore -c Release
      - dotnet build contexts/csharp10/CSharp10.csproj --no-restore -c Release
      - dotnet build contexts/csharp11/CSharp11.csproj --no-restore -c Release
      - dotnet build contexts/csharp12/CSharp12.csproj --no-restore -c Release
  lint:
    desc: Verify formatting and analyzer warnings for fixture-owned source.
    cmds:
      - dotnet restore TypesAndValues.sln --ignore-failed-sources --disable-parallel
      - dotnet format TypesAndValues.sln --verify-no-changes --no-restore
      - dotnet build src/Core/Core.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/AnnotatedApi/AnnotatedApi.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/ObliviousLegacy/ObliviousLegacy.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/AnnotationsOnly/AnnotationsOnly.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/WarningsOnly/WarningsOnly.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/DisabledScope/DisabledScope.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build src/Nullable/Consumer/Consumer.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp10/CSharp10.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp11/CSharp11.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
      - dotnet build contexts/csharp12/CSharp12.csproj --no-restore -c Release /p:TreatWarningsAsErrors=true
  test:
    desc: Succeed when a project has no test source.
    cmds:
      - echo "No test source"
