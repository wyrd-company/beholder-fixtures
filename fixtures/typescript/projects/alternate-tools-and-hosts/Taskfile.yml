version: '3'

tasks:
  build:
    desc: Type-check with tsc and exercise non-tsc transform and runtime-native hosts
    cmds:
      - npx tsc --noEmit
      - npx tsc --noEmit -p tsconfig.erasable.json
      - npx tsc --outDir dist --noEmit false
      - bun run scripts/bun-transpile.ts
      - bun run scripts/compiler-transform.ts
      - node --experimental-strip-types src/runtime-node-erasable.ts
      - bun run src/runtime-bun.ts

  lint:
    desc: tsc no-emit check over fixture sources (vendored source excluded, no tracked source mutated)
    cmds:
      - npx tsc --noEmit

  test:
    desc: No fixture tests; verifies runtime-native execution without type checking
    cmds:
      - node --experimental-strip-types src/runtime-node-erasable.ts
      - bun run src/runtime-bun.ts
