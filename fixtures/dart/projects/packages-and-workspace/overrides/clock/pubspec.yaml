# A local path fork of the vendored `clock` package (pinned upstream version
# 1.1.2, see ../../vendor/pub-cache/hosted/pub.dev/clock-1.1.2/), kept under
# the same package name and public API so the root override in
# ../../pubspec_overrides.yaml can substitute it for the hosted source under
# one stable `package:clock/` URI. Source and license are unmodified from the
# upstream package.
name: clock
version: 1.1.2
publish_to: none
description: >-
  Local path fork of the hosted clock package, used only to demonstrate the
  root dependency override that substitutes a hosted source with a local
  path under the same package identity.

environment:
  sdk: '>=3.12.2 <4.0.0'
